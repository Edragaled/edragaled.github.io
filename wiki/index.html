<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Chronicles Wiki</title>
<meta name="description" content="Items, monsters, loot tables and crafting recipes for Pixel Chronicles.">
<link rel="stylesheet" href="styles.css?v=456d25cf68">

<body>

<header class="topbar">

    <span class="brand-mark" aria-hidden="true"></span>
    <span>Pixel&nbsp;Chronicles<em>wiki</em></span>
  </a>

  <div class="search">
    <input id="search" type="search" placeholder="Search items, monsters, recipes…" autocomplete="off"
           spellcheck="false" aria-label="Search" aria-controls="suggestions" role="combobox" aria-expanded="false"
           data-i18n-placeholder="search.placeholder" data-i18n-aria="search.label">
    <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
  </div>

  <nav class="tabs" id="tabs">
    <a href="#/items" data-i18n="nav.items">Items</a>
    <a href="#/monsters" data-i18n="nav.monsters">Monsters</a>
    <a href="#/loot" data-i18n="nav.loot">Loot</a>
    <a href="#/recipes" data-i18n="nav.recipes">Recipes</a>
    <a href="#/sets" data-i18n="nav.sets">Sets</a>
    <a href="#/buildings" data-i18n="nav.buildings">Buildings</a>
    <a href="#/talents" data-i18n="nav.talents">Talents</a>
    <a href="#/status" data-i18n="nav.status">Status</a>
    <a href="#/tree" data-i18n="nav.tree">Tree</a>
    <a href="#/combat" data-i18n="nav.combat">Combat</a>
    <a href="#/modes" data-i18n="nav.modes">Modes</a>
    <a class="offsite" href="../">moonforge-games.com ↗</a>
  </nav>

  <div class="lang">
    <select id="lang" aria-label="Language" data-i18n-aria="lang.label"></select>
  </div>

  <button id="theme" class="icon-btn" type="button" aria-label="Toggle colour scheme" title="Toggle colour scheme"
          data-i18n-aria="theme.toggle" data-i18n-title="theme.toggle"></button>
</header>

<main id="view" aria-live="polite">
  <p class="loading">Loading game data…</p>
</main>

<footer class="footer">
  <span id="footer-meta"></span>
  <span class="sep">·</span>
  <span data-i18n="footer.tagline">Generated straight from the game build</span>
  <span class="sep">·</span>
  <a href="../">moonforge-games.com</a>
</footer>

<script src="app.js?v=456d25cf68"></script>
</body>
</html>
